name: Publish isolated full PVC-08 test
on:
  push:
    paths:
      - ".github/workflows/pvc08-full-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download validated GitHub Actions build
        env:
          DIST_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9534-8210-bb42-d6555923c32b/raw?se=2026-11-21T12%3A38%3A29Z&sp=r&sv=2026-06-06&sr=b&scid=fbe0645d-aba8-56bf-9e8f-3b0876855ab3&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T04%3A58%3A50Z&ske=2026-11-22T04%3A58%3A50Z&sks=b&skv=2026-06-06&sig=vogAJkF2duC82L8HUQtpXkt7/LTleudoXlPCyPYwKDk%3D"
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --location --silent --show-error "$DIST_ZIP_URL" --output /tmp/pvc08-dist.zip
          unzip -t /tmp/pvc08-dist.zip >/dev/null
          rm -rf cam-balkon-pvc-tam-test
          mkdir -p cam-balkon-pvc-tam-test
          unzip -q /tmp/pvc08-dist.zip -d cam-balkon-pvc-tam-test
          python3 - <<'PY'
          from pathlib import Path
          root=Path("cam-balkon-pvc-tam-test")
          expected=["index.html","panel/index.html","teklif/index.html","projeler/index.html","hizmetler/cam-balkon/index.html","hizmetler/pvc/index.html"]
          for item in expected:
              if not (root/item).is_file():
                  raise SystemExit("Missing required route: "+item)
          changed=0
          for f in root.rglob("*"):
              if f.is_file() and f.suffix in {".html",".js",".css",".svg",".md",".json"}:
                  raw=f.read_text(encoding="utf-8")
                  new=raw.replace("/cam-balkon-pvc-demo/","/cam-balkon-pvc-tam-test/")
                  if new!=raw:
                      f.write_text(new,encoding="utf-8")
                      changed+=1
          if changed < 10:
              raise SystemExit("Unexpectedly few URL replacements")
          for f in root.rglob("*"):
              if f.is_file() and f.suffix in {".html",".js",".css",".svg",".json"}:
                  if "/cam-balkon-pvc-demo/" in f.read_text(encoding="utf-8"):
                      raise SystemExit("Old demo URL remains: "+str(f))
          print("Validated isolated full demo, rewritten files:",changed)
          PY
      - name: Commit isolated static build without touching old preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cam-balkon-pvc-tam-test
          if git diff --staged --quiet; then
            echo "Test build already current"
          else
            git commit -m "build: publish PVC-08 full test in isolated folder"
            git push origin HEAD:main
          fi
