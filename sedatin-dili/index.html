<style>
:root{--navy:#142c44;--navy2:#213e5c;--gold:#e7b961;--text:#1a2e43;--muted:#65788b;--line:#e1e8ef;--paper:#f3f6f9;--white:#fff;--blue:#28597b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#e7eef3;color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e0a744;outline-offset:2px}
#app{min-height:100dvh;max-width:620px;margin:0 auto;background:var(--paper);padding-bottom:calc(75px + env(safe-area-inset-bottom));box-shadow:0 0 30px #142c4410}
.hero{padding:calc(15px + env(safe-area-inset-top)) 15px 16px;background:linear-gradient(125deg,#142c44,#214966);color:white;border-radius:0 0 19px 19px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-eyebrow{font-size:10px;letter-spacing:.12em;color:#edc47c;font-weight:800;margin:0 0 2px}
.hero-title{font-size:24px;font-weight:850;margin:0;line-height:1.2;letter-spacing:-.7px}
.hero-stat{font-size:11px;color:#d1dfeb;white-space:nowrap;text-align:right}
.lang-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#ffffff13;padding:5px;border:1px solid #ffffff20;border-radius:13px;margin-top:15px}
.lang-btn{background:transparent;color:#cddae5;border:0;border-radius:9px;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:750;min-height:41px}
.lang-btn.active{background:white;color:#18334e;box-shadow:0 3px 8px #061e311c}
.lang-flag{font-size:17px}
.search-wrap{display:flex;align-items:center;gap:8px;margin-top:11px;padding:0 11px;background:#fff;color:#7e91a3;border-radius:11px;min-height:42px}
.search-icon{font-size:17px;line-height:1}.search-wrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 0;color:#19324a;font-size:14px}.search-wrap input::placeholder{color:#8798a6}.search-clear{border:0;border-radius:7px;background:#eef3f6;color:#415a70;font-size:19px;line-height:1;width:28px;height:28px;display:none}.search-clear.visible{display:block}
.content{padding:14px 12px 0}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}.heading h2{margin:0;font-size:18px;letter-spacing:-.35px}.heading p{font-size:11px;color:var(--muted);margin:3px 0 0}.pill{font-size:11px;color:#58708b;border:1px solid #dae3eb;background:#fff;padding:5px 9px;border-radius:20px;white-space:nowrap;font-weight:750}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.category-card{border:1px solid var(--line);background:white;text-align:left;border-radius:13px;padding:11px;min-height:104px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 9px #16334a08}.category-card:active{transform:scale(.99)}.category-card.featured{border-color:#e8d2aa;background:#fffdf8}.category-card .cat-icon{font-size:23px;line-height:1.25}.category-card .cat-name{font-size:14px;line-height:1.2;font-weight:800;margin-top:3px}.category-card .cat-desc{font-size:10.5px;color:var(--muted);line-height:1.25}.category-card .cat-count{font-size:10.5px;font-weight:800;color:#8b651d;margin-top:auto;padding-top:5px}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#e8f0f6;color:#3e5d74;font-size:12px;line-height:1.5}
.intro-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.back{border:0;background:#e5ecf2;color:#284b68;font-size:12px;font-weight:800;border-radius:8px;padding:8px 11px}.subcount{font-size:11px;color:var(--muted)}
.category-header{display:flex;align-items:center;gap:9px;margin-bottom:7px}.category-header .ico{font-size:24px;width:38px;height:38px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;border-radius:10px}.category-header h2{font-size:18px;line-height:1.2;margin:0}.category-header p{font-size:11px;color:var(--muted);margin:3px 0 0}
.chips,.abc{display:flex;gap:5px;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar,.abc::-webkit-scrollbar{display:none}.chips{padding:3px 0 9px}.chip{background:#fff;border:1px solid #dbe4ec;color:#557086;border-radius:20px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap;min-height:31px}.chip.active{background:#1b425f;border-color:#1b425f;color:#fff}
.phrase-list{display:flex;flex-direction:column;gap:6px}.phrase-card{border:1px solid #e2e9ef;background:#fff;border-radius:11px;padding:9px 10px 9px 12px;box-shadow:0 1px 5px #102d4406}.phrase-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.phrase-original{font-size:14px;line-height:1.3;font-weight:680;color:#405772;overflow-wrap:anywhere;min-width:0;padding-top:2px}.star{flex:0 0 32px;width:32px;height:32px;margin:-3px -3px -3px 0;border:0;background:transparent;border-radius:8px;font-size:23px;line-height:1;color:#a9b4be;display:grid;place-items:center}.star.saved{color:#c48c28}.star:active{background:#f6eee1}
.phrase-pron{font-size:19px;font-weight:850;line-height:1.2;letter-spacing:-.33px;color:#163750;overflow-wrap:anywhere;margin-top:3px}.phrase-tr{font-size:13px;font-weight:510;line-height:1.3;color:#627487;margin-top:4px;overflow-wrap:anywhere}
.abc{padding:4px 0 11px}.letter{font-size:12px;border:1px solid #dce4ec;border-radius:8px;background:white;color:#304a60;min-width:34px;height:33px;font-weight:750}.letter.active{color:white;border-color:#1b425f;background:#1b425f}.letter:disabled{opacity:.28;cursor:default}

/* V3 — Sedat'ın Dili renk ve okunabilirlik sistemi */
:root{--navy:#142B45;--navy2:#244762;--gold:#E5AE48;--text:#182C40;--muted:#566879;--line:#DCE5EA;--paper:#F4F7FA;--white:#FFF;--blue:#188477;--teal:#188477;--teal-dark:#11695E}
body{background:#E8EEF2;color:var(--text)}
button:focus-visible,input:focus-visible{outline:3px solid #E5AE48;outline-offset:2px}
#app{background:var(--paper);box-shadow:0 0 32px #142B4514}
.hero{background:linear-gradient(128deg,#142B45 0%,#193C52 56%,#1D5255 100%);border-radius:0 0 20px 20px;padding:calc(11px + env(safe-area-inset-top)) 13px 13px}

.content{padding:12px 11px 0}.heading{margin-bottom:9px}.heading h2{color:#18364A}.pill{color:#176D62;border-color:#C8E7DE;background:#EAF7F2}

.panel-actions{display:flex;flex-wrap:wrap;gap:7px}.primary-button{border:0;background:#14796F;color:white;padding:11px 14px;border-radius:9px;font-weight:750;font-size:13px;min-height:41px}
.small-button,.tiny-button{border:1px solid #CFE2E5;background:#F1F8F7;border-radius:8px;padding:7px 9px;color:#176F64;font-size:12px;font-weight:760;white-space:nowrap}

.manage-buttons .tiny-button{min-height:39px;padding:8px 7px;font-size:12px}

.manage-item{padding:8px;gap:8px}

.quick-actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:0 0 11px}
.recent-btn,.return-btn{border:1px solid #c9e2de;background:#e9f7f3;color:#146c62;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:750;min-height:38px;line-height:1.25}

.order-controls{display:flex;align-items:center;gap:3px}

 try{const p=JSON.parse(sessionStorage.getItem(PROGRESSKEY)||'null');for(const l of ['de','en'])if(p&&p[l]&&typeof p[l].path==='string'&&Number.isFinite(p[l].y))lastCategory[l]={path:p[l].path,y:p[l].y,sub:String(p[l].sub||'Tümü')}}catch{}
 try{if(localStorage.getItem(ORDERKEY)!=='yes'){CATEGORIES.sort(categoryPriority);safeSave();localStorage.setItem(ORDERKEY,'yes')}}catch{CATEGORIES.sort(categoryPriority)}
}
function availableRecent(l=lang){return recent[l].map(id=>ALL_PHRASES[l].find(x=>x.id===id)).filter(Boolean).slice(0,10)}
function addRecent(id){if(!current().some(p=>p.id===id))return;const r=recent[lang];const already=r[0]===id;recent[lang]=[id,...r.filter(x=>x!==id)].slice(0,10);saveRecent();if(!already)toast('Son kullanılanlara eklendi')}
function searchMatch(p,query){
 const hay=norm([p.phrase,p.pron,p.tr,p.sub,CATEGORIES.find(c=>c.id===p.cat)?.name].join(' '));
 const toks=query.split(' ').filter(Boolean);
 return toks.every(t=>hay.includes(t)||SEARCH_GROUPS.some(g=>g.includes(t)&&g.some(s=>hay.includes(s))));
}
function saveProgress(){try{sessionStorage.setItem(PROGRESSKEY,JSON.stringify(lastCategory))}catch{}}
function rememberCategoryPosition(){
 const r=route();if(!r.startsWith('category/')||search.value.trim())return;
 if(!CATEGORIES.some(c=>'category/'+c.id===r))return;
 lastCategory[lang]={path:r,y:Math.max(0,Math.round(window.scrollY)),sub:subFilter};saveProgress();
}
function lastCategoryButton(){const p=lastCategory[lang];if(!p||!CATEGORIES.some(c=>'category/'+c.id===p.path))return'';const c=CATEGORIES.find(c=>'category/'+c.id===p.path);return `<button type="button" class="return-btn" data-return>↩ Kaldığım yere dön <span>· ${escapeHtml(c.name)}</span></button>`}
function scheduleRestore(p){if(!p)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{window.scrollTo({top:Math.max(0,p.y),behavior:'instant'});saveProgress()}))}

try{const k='sedatin-storage-test';localStorage.setItem(k,'1');localStorage.removeItem(k)}catch{storageReady=false}
function safeSave(){try{localStorage.setItem(DBKEY,JSON.stringify({v:4,categories:CATEGORIES,phrases:ALL_PHRASES,updated:new Date().toISOString()}));return true}catch{return false}}
function saveOpts(){try{localStorage.setItem(OPTKEY,JSON.stringify(settings));return true}catch{return false}}
function loadData(){try{let obj=JSON.parse(localStorage.getItem(DBKEY)||'null');if(obj&&obj.v===4&&validData(obj)){CATEGORIES.splice(0,CATEGORIES.length,...obj.categories);ALL_PHRASES.de.splice(0,ALL_PHRASES.de.length,...obj.phrases.de);ALL_PHRASES.en.splice(0,ALL_PHRASES.en.length,...obj.phrases.en)}}catch(e){console.warn('Kayıt okunamadı',e)}
try{let v=JSON.parse(localStorage.getItem(OPTKEY)||'null');if(v&&typeof v==='object')settings={dePron:v.dePron!==false,enPron:v.enPron===true}}catch{}
try{let old=localStorage.getItem('cepte-diller-v2-favorites');if(old)favorites=new Set(JSON.parse(old));else favorites=new Set((JSON.parse(localStorage.getItem('cepte-almanca-favoriler')||'[]')).map(n=>'de-'+n))}catch{}
try{let v=localStorage.getItem('cepte-diller-v2-lang');if(v==='en'||v==='de')lang=v}catch{}}
function validData(o){if(!o||!Array.isArray(o.categories)||o.categories.length>100||o.categories.length===0||!o.phrases||!Array.isArray(o.phrases.de)||!Array.isArray(o.phrases.en))return false;
if(o.phrases.de.length+o.phrases.en.length>4000)return false;
const cats=new Set();for(const c of o.categories){if(!c||typeof c.id!=='string'||typeof c.name!=='string'||typeof c.desc!=='string'||typeof c.icon!=='string'||!c.id||!c.name||c.name.length>100||c.id.length>80||cats.has(c.id))return false;cats.add(c.id)}
const ids=new Set();for(const lg of ['de','en'])for(const p of o.phrases[lg]){if(!p||typeof p.id!=='string'||ids.has(p.id)||p.id.length>100||!cats.has(p.cat)||p.lang!==lg||typeof p.phrase!=='string'||!p.phrase.trim()||p.phrase.length>400||typeof p.tr!=='string'||!p.tr.trim()||p.tr.length>400||typeof p.pron!=='string'||p.pron.length>400||typeof p.sub!=='string'||p.sub.length>100)return false;ids.add(p.id)}return true}
loadData();
readExtras();

const catCount=id=>current().filter(p=>p.cat===id).length;

const saveFav=()=>{try{localStorage.setItem('cepte-diller-v2-favorites',JSON.stringify([...favorites]))}catch{}};
function toast(s){let el=$('app-toast');el.textContent=s;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.hidden=true},2400)}
function go(target){
 rememberCategoryPosition();
 search.value='';letter='Tümü';alphabetOpen=false;
 const remembered=lastCategory[lang];
 pendingRestore=target.startsWith('category/')&&remembered?.path===target?{...remembered}:null;
 subFilter=pendingRestore?.sub||'Tümü';
 if(route()===target){render();if(pendingRestore)scheduleRestore(pendingRestore);else window.scrollTo(0,0);pendingRestore=null}
 else location.hash=target;
}

function renderAZ(){const sorted=[...current()].sort((a,b)=>a.phrase.localeCompare(b.phrase,lang==='de'?'de':'en'));const alphabet=lang==='de'?DE_LETTERS:EN_LETTERS;const available=new Set(sorted.map(p=>p.phrase[0].toLocaleUpperCase('de-DE')));let list=letter==='Tümü'?sorted:sorted.filter(p=>p.phrase.toLocaleUpperCase('de-DE').startsWith(letter));main.innerHTML=heading('A–Z Sözlük',list.length,`${langNames[lang]} · Alfabetik ifade listesi`)+lastCategoryButton()+`<button type="button" class="alphabet-trigger" data-az-toggle aria-expanded="${alphabetOpen}"><span>🔤 Harf seç: <strong>${escapeHtml(letter)}</strong></span><span>${alphabetOpen?'▲':'▼'}</span></button>${alphabetOpen?`<div class="alphabet-grid"><button class="letter ${letter==='Tümü'?'active':''}" data-letter="Tümü">Tümü</button>${alphabet.map(l=>`<button class="letter ${l===letter?'active':''}" data-letter="${l}" ${available.has(l)?'':'disabled'}>${l}</button>`).join('')}</div>`:''}${list.length?`<div class="phrase-list">${list.map(phraseCard).join('')}</div>`:empty('Bu harfte ifade yok.','Başka bir harf seç.')}`}

const p=current().find(x=>x.id===editingId);
const examples=lang==='de'?{phrase:'Örn. Wo ist der Ausgang?',pron:'Örn. Vo ist dea ausgang?'}:{phrase:'Örn. Where is the exit?',pron:'Örn. Ver iz di egzit?'};

function persist(message='Değişiklik kaydedildi'){const a=safeSave();render();toast(a?message:'Kaydedilemedi; JSON yedeği al')}
function newId(prefix){return `${prefix}-custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`}
function submitWord(form){const fd=new FormData(form);const fields=Object.fromEntries(fd.entries());if(!fields.phrase.trim()||!fields.tr.trim()||!CATEGORIES.find(c=>c.id===fields.cat)){toast('Yazılış, anlam ve kategori gerekli');return}let old=current().find(p=>p.id===editingId);let obj={id:old?.id||newId(lang),cat:fields.cat,phrase:fields.phrase.trim(),pron:fields.pron.trim(),tr:fields.tr.trim(),sub:fields.sub.trim(),lang};if(old)Object.assign(old,obj);else current().push(obj);manageCat=obj.cat;editingId=null;wordEditorOpen=false;manageSearch=obj.phrase;recentWordId=obj.id;undoAction=null;persist(old?'Kelime güncellendi':'Kelime eklendi · listede gösteriliyor')}
function submitCat(form){const v=Object.fromEntries(new FormData(form).entries());if(!v.name.trim()){toast('Kategori adı gerekli');return}const old=CATEGORIES.find(c=>c.id===editingCatId);if(old)Object.assign(old,{name:v.name.trim(),desc:v.desc.trim(),icon:v.icon.trim()||'🗂️'});else CATEGORIES.push({id:newId('cat'),name:v.name.trim(),desc:v.desc.trim(),hint:'',icon:v.icon.trim()||'🗂️'});editingCatId=null;catEditorOpen=false;undoAction=null;persist(old?'Kategori güncellendi':'Kategori eklendi')}
function downloadBackup(){const data={v:4,categories:CATEGORIES,phrases:ALL_PHRASES,settings,favorites:[...favorites],recent,appVersion:'4.4',exported:new Date().toISOString(),app:'Sedatın Dili'};const str=JSON.stringify(data,null,2);if(navigator.userAgent.includes('SedatinDiliApp')){const result=window.prompt('SEDAT_EXPORT',str);if(result==='OK')toast('Kaydetmek için klasör seç');return}const blob=new Blob([str],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Sedatin_Dili_Yedek_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('JSON yedeği hazırlandı')}
function importBackup(file){if(!file)return;if(file.size>4000000){toast('Dosya çok büyük');return}const reader=new FileReader();reader.onload=()=>{let obj;try{obj=JSON.parse(String(reader.result))}catch{toast('JSON okunamadı');return}if(!validData(obj)){toast('Yedek biçimi uygun değil');return}
    if(obj.recent!==undefined&&(obj.recent===null||typeof obj.recent!=='object'||['de','en'].some(l=>!Array.isArray(obj.recent[l])||obj.recent[l].some(x=>typeof x!=='string')))){toast('Yedekte son kullanılanlar bozuk');return}
    if(obj.settings!==undefined&&(obj.settings===null||typeof obj.settings!=='object'||(obj.settings.dePron!==undefined&&typeof obj.settings.dePron!=='boolean')||(obj.settings.enPron!==undefined&&typeof obj.settings.enPron!=='boolean'))){toast('Yedek ayarları bozuk');return}
    if(obj.favorites!==undefined&&(!Array.isArray(obj.favorites)||obj.favorites.some(x=>typeof x!=='string'))){toast('Yedek favorileri bozuk');return}
    if(!confirm('Bu yedek mevcut bütün kelime ve kategorilerin yerine geçecek. Devam?'))return;CATEGORIES.splice(0,CATEGORIES.length,...obj.categories);for(const lg of ['de','en'])ALL_PHRASES[lg].splice(0,ALL_PHRASES[lg].length,...obj.phrases[lg]);if(obj.settings)settings={dePron:obj.settings.dePron!==false,enPron:obj.settings.enPron===true};favorites=new Set(Array.isArray(obj.favorites)?obj.favorites.filter(x=>typeof x==='string'):[]);saveFav();saveOpts();recent.de=(obj.recent?.de||[]).filter(x=>typeof x==='string').slice(0,10);recent.en=(obj.recent?.en||[]).filter(x=>typeof x==='string').slice(0,10);saveRecent();lastCategory={de:null,en:null};saveProgress();if(!['4.2','4.3','4.4'].includes(obj.appVersion))CATEGORIES.sort(categoryPriority);editingCatId=null;editingId=null;catEditorOpen=false;wordEditorOpen=false;manageSearch='';undoAction=null;persist('Yedek geri yüklendi')};reader.onerror=()=>toast('Yedek okunamadı');reader.readAsText(file,'utf-8')}
function resetDefaults(){if(!confirm('Özel kelimeler, kategoriler ve değişiklikler silinecek. Önce yedek aldın mı?'))return;CATEGORIES.splice(0,CATEGORIES.length,...JSON.parse(JSON.stringify(defaultCats)));for(let lg of ['de','en'])ALL_PHRASES[lg].splice(0,ALL_PHRASES[lg].length,...JSON.parse(JSON.stringify(defaultWords[lg])));settings={dePron:true,enPron:false};saveOpts();editingCatId=null;editingId=null;manageCat='airport';manageSearch='';favorites.clear();saveFav();recent.de=[];recent.en=[];saveRecent();lastCategory={de:null,en:null};saveProgress();CATEGORIES.sort(categoryPriority);wordEditorOpen=false;catEditorOpen=false;undoAction=null;persist('Orijinal içerik geri yüklendi')}
function syncIconPicker(){const input=$('cat-icon-input');if(!input)return;document.querySelectorAll('[data-icon-choice]').forEach(b=>{const yes=b.dataset.iconChoice===input.value.trim();b.classList.toggle('chosen',yes);b.setAttribute('aria-pressed',String(yes))})}
function restoreDeletion(){if(!undoAction)return;const a=undoAction;undoAction=null;if(a.type==='word'){const arr=ALL_PHRASES[a.lang];if(!arr.some(x=>x.id===a.item.id)){arr.splice(Math.min(a.index,arr.length),0,a.item);if(a.wasFavorite)favorites.add(a.item.id);saveFav();if(Array.isArray(a.recentBefore)){recent[a.lang]=a.recentBefore.filter(id=>ALL_PHRASES[a.lang].some(x=>x.id===id)).slice(0,10);saveRecent()}}if(lang===a.lang){manageCat=a.item.cat;manageSearch=a.item.phrase;recentWordId=a.item.id}}else if(a.type==='cat'&&!CATEGORIES.some(x=>x.id===a.item.id)){CATEGORIES.splice(Math.min(a.index,CATEGORIES.length),0,a.item)}persist('Silme geri alındı')}
function moveCategory(id,dir){
 const i=CATEGORIES.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=CATEGORIES.length)return;
 const el=document.querySelector('.manage-list'),y=el?.scrollTop||0;
 const [c]=CATEGORIES.splice(i,1);CATEGORIES.splice(j,0,c);
 const ok=safeSave();render();const list=document.querySelector('.manage-list');if(list)list.scrollTop=y;
 toast(ok?'Kategori sırası kaydedildi':'Sıra geçici; JSON yedeği al');
}
function restoreLastCategory(){const p=lastCategory[lang];if(p)go(p.path)}
function handleUse(e){const row=e.target.closest('[data-use]');if(row&&!e.target.closest('[data-fav]'))addRecent(row.dataset.use)}
document.addEventListener('click',e=>{
if(e.target.closest('[data-return]')){restoreLastCategory();return}
const mv=e.target.closest('[data-move-cat]');if(mv){moveCategory(mv.dataset.moveCat,Number(mv.dataset.dir));return}
const use=e.target.closest('[data-use]');if(use&&!e.target.closest('button')){addRecent(use.dataset.use);return}

const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);return}
const fav=e.target.closest('[data-fav]');if(fav){const id=fav.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);saveFav();render();return}
const dest=e.target.closest('[data-go]');if(dest){go(dest.dataset.go);return}
const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}
const sub=e.target.closest('[data-sub]');if(sub){subFilter=sub.dataset.sub;render();return}
if(e.target.closest('[data-az-toggle]')){alphabetOpen=!alphabetOpen;render();return}
const lt=e.target.closest('[data-letter]');if(lt){letter=lt.dataset.letter;alphabetOpen=false;render();window.scrollTo({top:0,behavior:'instant'});return}
const tb=e.target.closest('[data-mtab]');if(tb){manageTab=tb.dataset.mtab;editingId=null;editingCatId=null;wordEditorOpen=false;catEditorOpen=false;render();return}
if(e.target.closest('[data-new-word]')){editingId=null;wordEditorOpen=true;render();$('word-editor')?.scrollIntoView({block:'nearest'});return}
if(e.target.closest('[data-cancel-word]')){editingId=null;wordEditorOpen=false;render();return}
if(e.target.closest('[data-new-cat]')){editingCatId=null;catEditorOpen=true;render();$('cat-editor')?.scrollIntoView({block:'nearest'});return}
if(e.target.closest('[data-cancel-cat]')){editingCatId=null;catEditorOpen=false;render();return}
const iconButton=e.target.closest('[data-icon-choice]');if(iconButton){const input=$('cat-icon-input');if(input){input.value=iconButton.dataset.iconChoice;syncIconPicker()}return}
if(e.target.closest('[data-undo]')){restoreDeletion();return}
const ew=e.target.closest('[data-edit-word]');if(ew){editingId=ew.dataset.editWord;wordEditorOpen=true;render();$('word-editor').scrollIntoView({behavior:'smooth',block:'start'});return}
const dw=e.target.closest('[data-del-word]');if(dw){let p=current().find(p=>p.id===dw.dataset.delWord);if(p&&confirm(`“${p.phrase}” silinsin mi? Yanlışlıkla silersen kontrol panelinden geri alabilirsin.`)){const i=current().findIndex(x=>x.id===p.id);const recentBeforeDelete=[...recent[lang]];recent[lang]=recent[lang].filter(x=>x!==p.id);saveRecent();undoAction={type:'word',lang,index:i,item:{...p},wasFavorite:favorites.has(p.id),label:p.phrase};current().splice(i,1);favorites.delete(p.id);saveFav();editingId=null;wordEditorOpen=false;persist('Kelime silindi · Geri alabilirsin')}return}
const ec=e.target.closest('[data-edit-cat]');if(ec){editingCatId=ec.dataset.editCat;catEditorOpen=true;render();$('cat-editor').scrollIntoView({behavior:'smooth',block:'start'});return}
const dc=e.target.closest('[data-del-cat]');if(dc){let id=dc.dataset.delCat;let c=CATEGORIES.find(x=>x.id===id);if(!c)return;if([...ALL_PHRASES.de,...ALL_PHRASES.en].some(p=>p.cat===id)){toast('Bu kategori boş değil; önce kelimelerini başka kategoriye taşı');return}if(confirm(`“${c.name}” adlı boş kategori silinsin mi? Geri alabilirsin.`)){const i=CATEGORIES.findIndex(x=>x.id===id);undoAction={type:'cat',index:i,item:{...c},label:c.name};CATEGORIES.splice(i,1);editingCatId=null;catEditorOpen=false;manageCat='all';persist('Kategori silindi · Geri alabilirsin')}return}
if(e.target.closest('[data-export]')){downloadBackup();return}
if(e.target.closest('[data-reset-defaults]')){resetDefaults();return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-use]')){e.preventDefault();addRecent(e.target.dataset.use)}});
document.addEventListener('submit',e=>{if(e.target.id==='word-form'){e.preventDefault();submitWord(e.target)}if(e.target.id==='cat-form'){e.preventDefault();submitCat(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='manage-cat'){manageCat=e.target.value;manageSearch='';render()}if(e.target.id==='set-de-pron'){settings.dePron=e.target.checked;saveOpts();toast('Almanca okunuş ayarı kaydedildi')}if(e.target.id==='set-en-pron'){settings.enPron=e.target.checked;saveOpts();toast('İngilizce okunuş ayarı kaydedildi')}if(e.target.id==='backup-file'){importBackup(e.target.files?.[0])}});
document.addEventListener('input',e=>{if(e.target.id==='manage-search'){manageSearch=e.target.value;updateEditorList()}if(e.target.id==='cat-icon-input')syncIconPicker()});
search.addEventListener('input',e=>{if(e.target.value.trim()&&route().startsWith('category/')&&e.target.value.length===1)rememberCategoryPosition();render();if(!e.target.value.trim()&&route().startsWith('category/'))scheduleRestore(lastCategory[lang])});
$('clear-search').addEventListener('click',()=>{search.value='';search.focus();render();if(route().startsWith('category/'))scheduleRestore(lastCategory[lang])});
addEventListener('hashchange',()=>{const r=route();const p=pendingRestore||(r.startsWith('category/')&&lastCategory[lang]?.path===r?lastCategory[lang]:null);subFilter=p?.sub||'Tümü';letter='Tümü';alphabetOpen=false;render();if(p)scheduleRestore(p);else window.scrollTo(0,0);pendingRestore=null});
addEventListener('scroll',()=>{if(route().startsWith('category/')&&!search.value.trim())rememberCategoryPosition()},{passive:true});
addEventListener('pagehide',()=>rememberCategoryPosition());
if(!location.hash)history.replaceState(null,'','#home');render();

</script>
<script id="pwa-enhancement">
(() => {
 let installPrompt=null;
 const button=document.getElementById("pwa-install-btn");
 const installed=()=>window.matchMedia("(display-mode: standalone)").matches;
 if("serviceWorker" in navigator) window.addEventListener("load",()=>{
   navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(()=>navigator.serviceWorker.ready).catch(e=>console.warn("PWA çevrimdışı kurulum:",e));
 });
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;if(button&&!installed())button.hidden=false;});
 button?.addEventListener("click",async()=>{
   if(!installPrompt)return;
   const p=installPrompt;installPrompt=null;button.hidden=true;
   await p.prompt();await p.userChoice;
 });
 window.addEventListener("appinstalled",()=>{installPrompt=null;if(button)button.hidden=true;});
})();
</script>
</body></html>
